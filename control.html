<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change UK Control Room</title><link rel="stylesheet" href="style.css"><style>body{background:#121015;min-height:100vh;color:#eee}.control{max-width:1200px;margin:auto;padding:28px}.control-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.control-top img{width:120px;border-radius:10px}.panel{background:#1d1921;border:1px solid #332b38;border-radius:22px;padding:22px;margin-bottom:16px}.panel h2{margin-top:0}.control input,.control textarea,.control select{width:100%;padding:12px;border-radius:10px;border:1px solid #403547;background:#151218;color:#fff;font:inherit}.control label{display:block;font-size:12px;font-weight:700;color:#bfb3c8;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.policy-edit{border:1px solid #382f3e;border-radius:15px;padding:15px;margin:10px 0;background:#17131a}.hidden{display:none}.danger{background:#6f2131;color:#fff}@media(max-width:760px){.grid{grid-template-columns:1fr}.control{padding:15px}}</style></head><body><div class="control"><div class="control-top"><div><span class="eyebrow light">PRIVATE</span><h1>Control Room</h1></div><img src="logo.png" alt=""></div><section id="adminLogin" class="panel"><h2>Admin sign in</h2><p>This page is intentionally not linked from the public navigation. Database Row Level Security still provides the real protection.</p><label>Email<input id="aEmail" type="email"></label><label>Password<input id="aPass" type="password"></label><button class="btn primary" id="aLogin">Sign in</button><p id="aStatus" class="form-note"></p></section><div id="adminUI" class="hidden"><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><div><span class="eyebrow">LIVE FIGURES</span><h2>Representation</h2></div><button class="btn dark" id="aLogout">Sign out</button></div><div class="grid"><label>MPs<input id="sMps" type="number" min="0"></label><label>Councillors<input id="sCouncillors" type="number" min="0"></label><label>Councils<input id="sCouncils" type="number" min="0"></label></div><label>Homepage notice<input id="sNotice"></label><button class="btn primary" id="saveStats">Save figures</button></section><section class="panel"><span class="eyebrow">MANIFESTO</span><h2>Policies + quiz</h2><div id="policyEditor"></div><button class="btn primary" id="newPolicy">+ Add policy</button></section><section class="panel"><span class="eyebrow">LATEST</span><h2>Publish update</h2><label>Headline<input id="nTitle"></label><label>Body<textarea id="nBody" rows="5"></textarea></label><button class="btn primary" id="publishNews">Publish</button></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="control.js"></script></body></html>
